<div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
    <a href="#inicio" class="flex items-center space-x-3 rtl:space-x-reverse">
        <img src="{{url_for('static', filename='images/logo-concretum.png')}}" alt="Hero Image" class="h-8 w-auto">
    </a>
    <button data-collapse-toggle="navbar-default" type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
        aria-controls="navbar-default" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
    </button>
    <div class="hidden w-full md:block md:w-auto" id="navbar-default">
        <ul
            class="font-medium flex flex-col p-4 md:p-0 mt-4 rounded-base md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0">
            <li>
                <a href="#inicio" class="block py-2 px-3 text-[#70A7C7] rounded md:text-[#70A7C7] md:p-0"
                    aria-current="page">Inicio</a>
            </li>
            <li>
                <a href="#productos"
                    class="block py-2 px-3 text-[#70A7C7] rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Productos</a>
            </li>
            <li>
                <a href="#nosotros"
                    class="block py-2 px-3 text-[#70A7C7] rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Nosotros</a>
            </li>
            <li>
                <a href="#contacto"
                    class="block py-2 px-3 text-[#70A7C7] rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Contacto</a>
            </li>
            {% if not current_user.is_authenticated %}
                <li>
                    <a href="{{ url_for('security.login') }}"
                        class="bg-[#008DC0] text-white px-4 py-2 rounded-md font-roboto font-medium hover:bg-transparent hover:text-white hover:border hover:border-[white] transition-all duration-300">
                        Iniciar sesión
                    </a>
                </li>
            {% else %}
                <li>
                    {% if current_user.has_role('CLIENTE') %}
                        <a href="{{ url_for('carrito_bp.dashboard_cliente') }}"
                            class="bg-[#008DC0] text-white px-4 py-2 rounded-md font-roboto font-medium hover:bg-transparent hover:text-white hover:border hover:border-[white] transition-all duration-300 shadow-md">
                            Ir a Mi Panel
                        </a>
                    {% else %}
                        <a href="{{ url_for('comercial_bp.dashboard') }}"
                            class="bg-emerald-600 text-white px-4 py-2 rounded-md font-roboto font-medium hover:bg-transparent hover:text-emerald-400 hover:border hover:border-emerald-400 transition-all duration-300 shadow-md">
                            Panel de Empleado
                        </a>
                    {% endif %}
                </li>
            {% endif %}
        </ul>
    </div>
</div>
