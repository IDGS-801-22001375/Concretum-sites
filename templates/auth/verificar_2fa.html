<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación 2FA - CRM Concretum</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-200 dark:bg-gray-800 dark:border-gray-700">
        <h2 class="text-2xl font-bold mb-4 text-gray-900 dark:text-white text-center">Verificación en 2 Pasos</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-6 text-center">
            Ingresa el código de 6 dígitos de tu aplicación autenticadora.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 mb-4 rounded-lg {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-center text-gray-900 dark:text-white">Código de 6 dígitos</label>
                <input type="text" name="codigo" class="bg-gray-50 border border-gray-300 text-gray-900 text-center text-2xl tracking-[1rem] rounded-lg block w-full p-3 dark:bg-gray-700 dark:text-white" placeholder="000000" autocomplete="off" required>
            </div>
            <button type="submit" class="w-full text-white bg-blue-700 hover:bg-blue-800 font-bold rounded-lg px-5 py-3">
                Verificar y Entrar
            </button>
        </form>
    </div>
</body>
</html>
