{# Fragmento puro para el carrito, SIN extends #}
{% for item in items_carrito %}
<div id="item-{{ item.id_item }}" class="flex gap-3 bg-gray-50 rounded-xl p-3 border border-gray-100">
    <img src="{{ url_for('static', filename=item.producto.enlace_fotografia) }}"
        class="w-16 h-16 object-cover rounded-lg bg-[#A5CDE3] shrink-0">
    <div class="flex-1 min-w-0">
        <p class="text-[#002F5C] font-semibold text-sm truncate">{{ item.producto.nombre }}</p>
        <p class="text-gray-400 text-xs mt-0.5">${{ "%.2f"|format(item.precio_unitario) }} / ud.</p>
        <div class="flex items-center gap-1 mt-1">
            <button onclick="cambiarCantidadDirecta({{ item.id_item }}, -1)"
                class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-[#008DC0] transition flex items-center justify-center font-bold text-base">−</button>
            <input type="number" id="cant-{{ item.id_item }}" value="{{ item.cantidad|int }}" min="1"
                max="9999" step="1"
                class="w-12 text-center text-sm font-semibold bg-gray-50 rounded-lg border border-gray-200 focus:ring-1 focus:ring-[#008DC0] focus:border-[#008DC0] outline-none">
            <button onclick="cambiarCantidadDirecta({{ item.id_item }}, 1)"
                class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-[#008DC0] transition flex items-center justify-center font-bold text-base">+</button>
        </div>
    </div>
    <div class="flex flex-col items-end justify-between shrink-0">
        <button onclick="quitarItem({{ item.id_item }})"
            class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-500/20 rounded-lg transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </button>
        <span id="sub-{{ item.id_item }}" class="text-[#002F5C] font-bold text-sm">${{ "%.2f"|format(item.subtotal) }}</span>
    </div>
</div>
{% else %}
<div id="carrito-vacio" class="flex flex-col items-center justify-center h-full text-center py-16">
    <svg class="w-16 h-16 text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
    </svg>
    <p class="text-gray-400 font-medium">Tu carrito está vacío</p>
</div>
{% endfor %}
