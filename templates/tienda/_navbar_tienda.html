<div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
  <a href="{{ url_for('carrito_bp.catalogo') }}" class="flex items-center space-x-3">
    <img src="{{ url_for('static', filename='images/logo-concretum.png') }}" alt="Logo Concretum" class="h-8 w-auto">
  </a>

  <div class="hidden md:flex items-center gap-6 text-sm font-medium">
    <a href="{{ url_for('carrito_bp.catalogo') }}"
      class="text-[#70A7C7] hover:text-white transition flex items-center gap-2">
      Catálogo
    </a>
    <a href="{{ url_for('carrito_bp.dashboard_cliente') }}"
      class="text-[#70A7C7] hover:text-white transition flex items-center gap-2">
      Mi cuenta
    </a>
  </div>

  <div class="flex items-center gap-4">
    <button onclick="abrirCarrito()" class="relative flex items-center text-[#70A7C7] hover:text-white transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span
        class="badge-carrito absolute -top-2 -right-2 bg-[#008DC0] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center {% if total_items_carrito == 0 %}hidden{% endif %}">
        {{ total_items_carrito }}
      </span>
    </button>

    <div class="relative">
      <button id="user-menu-btn"
        class="flex items-center gap-2 text-[#70A7C7] hover:text-white focus:outline-none transition pl-4 border-l border-[#1E3A5F]">
        <div class="w-8 h-8 rounded-full bg-[#008DC0] flex items-center justify-center text-white font-bold text-sm">
          {{ current_user.username[:1]|upper }}
        </div>
        <span class="hidden sm:inline text-sm font-medium">{{ current_user.username }}</span>
      </button>
      <div id="user-dropdown"
        class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-100 z-50 overflow-hidden">

        <a href="{{ url_for('configurar_2fa') }}"
          class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 transition border-b border-gray-100">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          Configurar Seguridad (2FA)
        </a>

        <a href="{{ url_for('security.logout') }}"
          class="flex items-center gap-3 px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar sesión
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  const userBtn = document.getElementById('user-menu-btn');
  const userDropdown = document.getElementById('user-dropdown');
  if (userBtn && userDropdown) {
    userBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', () => userDropdown.classList.add('hidden'));
  }
</script>
